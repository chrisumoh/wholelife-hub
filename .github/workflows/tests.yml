name: Tests

# Runs on every pull request and every push to main. Needs no secrets: the browser tests use a fake Supabase
# (or a faked network), so no real account or database is touched. See tests/ and docs/BUILD_PLAN.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/perf/size.test.mjs
      - name: Size budget and PR growth
        run: node tests/perf/size.mjs
        env:
          PERF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Scripts parse, the version agrees everywhere, vercel.json is valid, no secrets, food data is text only.
      - run: node --test tests/sync-recovery.cjs tests/pwa-kit.cjs
      - run: node --test tests/license-logic.test.mjs tests/license-handler.test.mjs tests/delete-account-handler.test.mjs tests/wl-coach-handler.test.mjs
      - run: node tests/check-repo.mjs

  # Runs the coach SQL on a throwaway PostgreSQL 16 started just for this job (never Supabase, never production): ten real connections racing
  # for the last slot, the rolling hour, failure paths, consent, privileges and row-level security. The handler tests use a pretend reserve and cannot prove these.
  coach-database:
    name: Coach database (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/db/coach-reserve.test.mjs
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-disposable

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chrome version
        run: google-chrome --version
      # headers, security, meal-sync, meal-upload, controls, glass: one after another, each in its own headless Chrome.
      - run: node tests/browser/run-all.mjs
        env:
          CHROME: /usr/bin/google-chrome

  # Validates every committed SQL migration against an empty, disposable database.
  # No Supabase credentials, production data, or paid preview branch are used.
  database-migrations:
    name: Database migrations (local PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify migrations
        run: bash tests/db/check-migrations.sh

  # The release gate: size and phone-speed budgets in tests/perf/budget.json (mid-range phone, a year of logs). About two minutes.
  # Make this check required in the repository's branch protection to stop a merge that makes the app slower or heavier.
  perf-gate:
    name: Performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/perf/measure.mjs --gate
        env:
          CHROME: /usr/bin/google-chrome
          CI: "1"

